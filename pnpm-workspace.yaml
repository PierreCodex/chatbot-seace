# pnpm 10+/11 movió `onlyBuiltDependencies` aquí (ya no se lee del package.json).
# Permite ejecutar los postinstall de estos paquetes (Prisma necesita su query
# engine; el resto traen binarios nativos). Sin esto, el build falla con
# ERR_PNPM_IGNORED_BUILDS. Ver docs/19-deploy-railway.md.
onlyBuiltDependencies:
  - '@prisma/client'
  - '@prisma/engines'
  - prisma
  - '@nestjs/core'
  - esbuild
  - msgpackr-extract
